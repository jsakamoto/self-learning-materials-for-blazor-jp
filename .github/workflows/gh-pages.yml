name: github pages

on:
  push:
    branches:
      - public-edition
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v6
        with:
          ref: public-edition
          path: code

      # Checkout the doc
      - uses: actions/checkout@v6
        with:
          ref: master
          path: doc

      # Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install .NET WebAssembly Tools
        run: dotnet workload install wasm-tools

      # Publish the site
      - name: Publish
        run: dotnet publish code/Client -c:Release -o:public -p:GHPages=true -p:UseLocalStorage=true

      # Copy the doc
      - name: Copy the PDF
        run: cp doc/*.pdf public/wwwroot

      # Deploy the site
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/wwwroot
          force_orphan: true